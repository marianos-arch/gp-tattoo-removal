<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Garden Pathways Non-Profit{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Google Fonts for an earthy, professional look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="logo">🌱 Garden Pathways</a>
      <nav>
        <ul class="nav-links">
          <li><a href="#about">About Us</a></li>
          <li><a href="#status">Live Status</a></li>
          <li><a href="#contact" class="btn-secondary">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container footer-content">
      <p>&copy; 2026 Garden Pathways Non-Profit. Building stronger communities together.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
