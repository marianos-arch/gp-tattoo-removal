<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Garden Pathways - Free Tattoo Removal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="logo-link">
        <img src="{{ url_for('static', filename='GP_Logo.jpg') }}" alt="Garden Pathways Logo" class="nav-logo">
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="https://gardenpathways.org" target="_blank" rel="noopener noreferrer">Main Site ↗</a></li>
          <li><a href="#status">Live Status</a></li>
          <li><a href="tel:6616339133" class="btn-secondary">Call (661) 633-9133</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container footer-content">
      <p>&copy; 2026 Garden Pathways Non-Profit. Building stronger communities together.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
